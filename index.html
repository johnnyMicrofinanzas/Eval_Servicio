<!DOCTYPE html>
<html lang="es-BO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Scoring SERVICIOS — Evaluación de Microcrédito</title>
<meta name="description" content="Sistema de scoring crediticio individual, sector Servicios. Metodología 5 Cs del Crédito, normativa ASFI Bolivia. Funciona sin conexión a internet.">
<meta name="theme-color" content="#1C5C3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scoring SERVICIOS">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root {
  --ink:        #16233F;
  --ink-2:      #45526E;
  --ink-3:      #7C879E;
  --paper:      #EEF1F6;
  --surface:    #FFFFFF;
  --surface-2:  #F3F5F9;
  --surface-3:  #E6EAF2;
  --line:       #D7DEEA;
  --line-soft:  #E7EBF3;

  --brand:      #1C5C3A;
  --brand-2:    #2E8B57;
  --brand-ink:  #0E3320;
  --brand-soft: #E5F3EB;

  --gold:       #B7852E;
  --gold-soft:  #FBF0DA;
  --gold-ink:   #6E4F16;

  --risk-1:      #1C7A4C;
  --risk-1-soft: #E3F5EB;
  --risk-2:      #A87A16;
  --risk-2-soft: #FBF0D9;
  --risk-3:      #B0591E;
  --risk-3-soft: #FBE7D7;
  --risk-4:      #A82A28;
  --risk-4-soft: #FBE2E1;

  --danger:     #A82A28;
  --danger-soft:#FBE2E1;
  --ok:         #1C7A4C;
  --ok-soft:    #E3F5EB;
  --warn:       #A87A16;
  --warn-soft:  #FBF0D9;
  --info:       #1F5FA8;
  --info-soft:  #E7EEF9;

  --radius: 14px;
  --radius-sm: 9px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  padding-bottom: 24px;
}
h1,h2,h3,h4 { margin: 0 0 8px 0; color: var(--ink); }
h1 { font-size: 19px; font-weight: 800; }
h2 { font-size: 15px; font-weight: 800; color: var(--brand-ink); }
h3 { font-size: 13px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing:.03em; }
p { margin: 0 0 8px 0; line-height:1.45; }
button { font-family: inherit; }

/* ---- Top bar ---- */
.appheader { position: sticky; top:0; z-index: 40; }
.topbar {
  background: var(--brand); color: #fff;
  padding: 12px 14px calc(12px + env(safe-area-inset-top,0px));
  padding-top: calc(12px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:10px;
}
.topbar .titles { flex:1; min-width:0; }
.topbar .titles h1 { color:#fff; font-size:16px; }
.topbar .sub { color: var(--brand-soft); font-size:11.5px; opacity:.85; }
.topbar button.icon-btn {
  background: rgba(255,255,255,.12); border:none; color:#fff;
  width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer;
}

/* ---- Screens ---- */
.screen { display:none; padding: 14px; max-width: 720px; margin:0 auto; }
.screen.active { display:block; }
.card {
  background: var(--surface); border:1px solid var(--line-soft);
  border-radius: var(--radius); padding:14px; margin-bottom:12px;
  box-shadow: 0 1px 2px rgba(22,35,63,.04);
}
.card + .card { margin-top:12px; }
.hero {
  background: linear-gradient(135deg, var(--brand), var(--brand-ink));
  color:#fff; border-radius: var(--radius); padding:18px; margin-bottom:14px;
}
.hero h1 { color:#fff; font-size:20px; }
.hero p { color: var(--brand-soft); font-size:13px; margin:0; }

.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:420px){ .grid3{grid-template-columns:1fr 1fr;} }

.field { margin-bottom:10px; }
.field label {
  display:block; font-size:11.5px; font-weight:700; color: var(--ink-2);
  margin-bottom:4px; text-transform: uppercase; letter-spacing:.02em;
}
.field input, .field select, .field textarea {
  width:100%; padding:10px 11px; border:1.5px solid var(--line);
  border-radius: var(--radius-sm); font-size:15px; background: var(--surface);
  color: var(--ink); font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline:none; border-color: var(--brand-2);
}
.field .hint { font-size:11px; color: var(--ink-3); margin-top:3px; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 16px; border-radius:11px; border:none; font-weight:700;
  font-size:14px; cursor:pointer;
}
.btn-primary { background: var(--brand); color:#fff; }
.btn-gold { background: var(--gold); color:#fff; }
.btn-outline { background: var(--surface); color: var(--brand); border:1.5px solid var(--brand); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-block { width:100%; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }

table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
table.tbl th { text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--ink-3); padding:6px 4px; border-bottom:2px solid var(--line); }
table.tbl td { padding:6px 4px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
table.tbl input, table.tbl select { padding:6px 7px; font-size:13px; border:1px solid var(--line); border-radius:7px; width:100%; }
table.tbl tr.total td { font-weight:800; background: var(--surface-2); }
.tbl-wrap { overflow-x:auto; }

.kpi-row { display:flex; gap:10px; flex-wrap:wrap; }
.kpi { flex:1; min-width:130px; background: var(--surface-2); border-radius: var(--radius-sm); padding:10px 12px; }
.kpi .lbl { font-size:10.5px; color:var(--ink-3); text-transform:uppercase; font-weight:700;}
.kpi .val { font-size:19px; font-weight:800; color: var(--brand-ink); }
.kpi.risk-1 { background: var(--risk-1-soft); } .kpi.risk-1 .val{ color:var(--risk-1);}
.kpi.risk-2 { background: var(--risk-2-soft); } .kpi.risk-2 .val{ color:var(--risk-2);}
.kpi.risk-3 { background: var(--risk-3-soft); } .kpi.risk-3 .val{ color:var(--risk-3);}
.kpi.risk-4 { background: var(--risk-4-soft); } .kpi.risk-4 .val{ color:var(--risk-4);}

.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:800; }
.badge.risk-1 { background: var(--risk-1-soft); color:var(--risk-1); }
.badge.risk-2 { background: var(--risk-2-soft); color:var(--risk-2); }
.badge.risk-3 { background: var(--risk-3-soft); color:var(--risk-3); }
.badge.risk-4 { background: var(--risk-4-soft); color:var(--risk-4); }
.badge.ok { background:var(--ok-soft); color:var(--ok); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--danger-soft); color:var(--danger); }

.alert { border-radius: var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:10px; }
.alert.bad { background: var(--danger-soft); color: var(--danger); font-weight:700; }
.alert.warn { background: var(--warn-soft); color: var(--warn-ink,#6E4F16); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert.info { background: var(--info-soft); color: var(--info); }

.scoring-item { border-bottom:1px solid var(--line-soft); padding:10px 0; }
.scoring-item .head { display:flex; justify-content:space-between; gap:8px; font-size:13px; font-weight:700; margin-bottom:4px;}
.scoring-item .desc { font-size:11.5px; color:var(--ink-3); margin-bottom:6px; }
.scale-opts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
@media (max-width:380px){ .scale-opts{grid-template-columns:1fr;} }
.scale-opt {
  border:1.5px solid var(--line); border-radius:9px; padding:7px 9px; font-size:12px;
  cursor:pointer; user-select:none; background:var(--surface);
}
.scale-opt.sel-1.active { border-color: var(--risk-1); background: var(--risk-1-soft); color:var(--risk-1); font-weight:700; }
.scale-opt.sel-2.active { border-color: var(--risk-2); background: var(--risk-2-soft); color:var(--risk-2); font-weight:700; }
.scale-opt.sel-3.active { border-color: var(--risk-3); background: var(--risk-3-soft); color:var(--risk-3); font-weight:700; }
.scale-opt.sel-4.active { border-color: var(--risk-4); background: var(--risk-4-soft); color:var(--risk-4); font-weight:700; }
.cat-header {
  background: var(--brand-soft); color: var(--brand-ink); font-weight:800; font-size:13.5px;
  padding:9px 12px; border-radius:9px; margin: 14px 0 8px 0; display:flex; justify-content:space-between;
}

/* ---- Top nav (tabs) ---- */
.topnav {
  background: var(--surface); border-bottom:1px solid var(--line);
  display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width: none;
}
.topnav::-webkit-scrollbar { display:none; }
.topnav button {
  flex: 0 0 auto; background:none; border:none; display:flex; flex-direction:column;
  align-items:center; gap:2px; padding:8px 12px; color: var(--ink-3); font-size:10.5px; font-weight:700;
  cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent;
}
.topnav button .ic { font-size:17px; }
.topnav button.active { color: var(--brand); border-bottom-color: var(--brand); background: var(--brand-soft); }

.list-item {
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:11px 4px; border-bottom:1px solid var(--line-soft);
}
.list-item .meta { font-size:11.5px; color:var(--ink-3); }
.muted { color: var(--ink-3); font-size:12.5px; }
.right { text-align:right; }
.row-flex { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.small-btn { padding:5px 9px; font-size:11.5px; border-radius:7px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; }
.tbl-flujo { font-size: 11.5px; }
.tbl-flujo th, .tbl-flujo td { padding: 5px 6px; white-space: nowrap; }
.tbl-flujo th:first-child, .tbl-flujo td:first-child {
  position: sticky; left: 0; background: var(--surface); text-align: left;
  white-space: normal; min-width: 140px; box-shadow: 2px 0 3px rgba(0,0,0,.05);
}
.tbl-flujo tr.total td:first-child { background: var(--surface-2); }
hr.sep { border:none; border-top:1px dashed var(--line); margin:10px 0; }
.tag { font-size:10.5px; background:var(--surface-3); color:var(--ink-2); padding:2px 7px; border-radius:6px; font-weight:700;}

/* ============================================================================
   IMPRESIÓN — dos modos: "Imprimir Todo" (todas las pantallas) o
   "Imprimir Solo Resolución" (activado agregando .print-resolucion-only al body)
   Resolución: fuente Calibri, títulos 16pt, diseño compacto en hoja Carta.
   ============================================================================ */
@page { size: letter; margin: 0.35in; }
@media print {
  .appheader, .no-print { display: none !important; }
  body { padding-bottom: 0; background: #fff; }
  .screen { display: block !important; padding: 6px 0; page-break-after: always; }
  .screen:last-child { page-break-after: auto; }
  .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  .tbl-flujo { font-size: 9px; }
  .tbl-flujo th, .tbl-flujo td { padding: 3px 4px; }

  body.print-resolucion-only .screen { display: none !important; }
  body.print-resolucion-only #screen-resolucion { display: block !important; page-break-after: auto; }

  body.print-resolucion-only #screen-resolucion,
  body.print-resolucion-only #screen-resolucion * {
    font-family: Calibri, 'Segoe UI', Arial, sans-serif !important;
  }
  body.print-resolucion-only #resolucion-imprimible { font-size: 7.2pt; line-height: 1.15; }
  body.print-resolucion-only #resolucion-imprimible h1 { font-size: 16pt; font-weight: 800; margin: 0 0 4px 0; }
  body.print-resolucion-only #resolucion-imprimible h2 { font-size: 9.5pt; font-weight: 700; margin: 6px 0 3px 0; }
  body.print-resolucion-only #resolucion-imprimible p.hint { font-size: 6.6pt; margin: 2px 0; }
  body.print-resolucion-only #resolucion-imprimible .card { padding: 5px 7px; margin-bottom: 5px; border: 0.5pt solid #999; }
  body.print-resolucion-only #resolucion-imprimible table.tbl,
  body.print-resolucion-only #resolucion-imprimible table.tbl-diagnostico { font-size: 6.8pt; width: 100%; border-collapse: collapse; }
  body.print-resolucion-only #resolucion-imprimible table.tbl th,
  body.print-resolucion-only #resolucion-imprimible table.tbl td,
  body.print-resolucion-only #resolucion-imprimible table.tbl-diagnostico th,
  body.print-resolucion-only #resolucion-imprimible table.tbl-diagnostico td { padding: 1.5px 3px; border-bottom: 0.5pt solid #ddd; }
  body.print-resolucion-only #resolucion-imprimible .tbl-diagnostico td:nth-child(7) { min-width: 0; max-width: none; font-size: 6.4pt; }
  body.print-resolucion-only #resolucion-imprimible .grid3 .mini-field,
  body.print-resolucion-only #resolucion-imprimible .datos-actividad .mini-field { padding: 2px 4px; }
  body.print-resolucion-only #resolucion-imprimible .mini-field label { font-size: 5.6pt; }
  body.print-resolucion-only #resolucion-imprimible .mini-field .mini-val { font-size: 6.6pt; }
  body.print-resolucion-only #resolucion-imprimible .kpi { padding: 3px 5px; }
  body.print-resolucion-only #resolucion-imprimible .kpi .lbl { font-size: 5.8pt; }
  body.print-resolucion-only #resolucion-imprimible .kpi .val { font-size: 9pt; }
  body.print-resolucion-only #resolucion-imprimible .badge { font-size: 6.5pt; padding: 1.5px 5px; }
  body.print-resolucion-only #resolucion-imprimible .alert { font-size: 6.6pt; padding: 3px 5px; }
  body.print-resolucion-only #resolucion-imprimible hr.sep { margin: 4px 0; }
}

.datos-actividad { gap: 8px; }
.mini-field { background: var(--surface-2); border-radius: 8px; padding: 7px 9px; }
.mini-field label { display:block; font-size:9.5px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.02em; margin-bottom:2px; }
.mini-field .mini-val { font-size:12px; color:var(--ink); line-height:1.3; }
@media (max-width:480px){ .datos-actividad{ grid-template-columns: 1fr 1fr; } }

.scoring-item.sin-responder { background: var(--warn-soft); border-radius: 9px; padding: 10px 8px; margin: 0 -8px 0 -8px; }
.tag.bad { background: var(--danger-soft); color: var(--danger); }

.tbl-diagnostico { font-size: 10.5px; }
.tbl-diagnostico th, .tbl-diagnostico td { padding: 5px 6px; }
.tbl-diagnostico td:nth-child(7), .tbl-diagnostico td:nth-child(8) { min-width: 180px; max-width: 240px; white-space: normal; line-height: 1.35; }

.tag.ok { background: var(--ok-soft); color: var(--ok); }

.garantia-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; }
.garantia-tipo { font-weight: 700; font-size: 13.5px; color: var(--brand-ink); margin-bottom: 8px; }
.garantia-ponderado { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }

</style>
</head>
<body>

<div class="appheader">
  <div class="topbar">
    <div class="titles">
      <h1>Scoring SERVICIOS</h1>
      <div class="sub">Microcrédito Individual · 5 Cs del Crédito · 1000 pts</div>
    </div>
    <button class="icon-btn" onclick="goScreen('inicio')" title="Inicio">🏠</button>
  </div>
  <div class="topnav">
    <button data-nav="inicio"><span class="ic">🏠</span>Inicio</button>
    <button data-nav="cliente"><span class="ic">🧾</span>Cliente</button>
    <button data-nav="balance"><span class="ic">📊</span>Balance</button>
    <button data-nav="colateral"><span class="ic">🔒</span>Colateral</button>

    <button data-nav="ia"><span class="ic">🤖</span>IA</button>

  </div>
</div>

<div id="screen-inicio" class="screen active"></div>
<div id="screen-cliente" class="screen"></div>
<div id="screen-balance" class="screen"></div>
<div id="screen-colateral" class="screen"></div>
<div id="screen-flujo" class="screen"></div>
<div id="screen-scoring" class="screen"></div>
<div id="screen-resolucion" class="screen"></div>
<div id="screen-ia" class="screen"></div>
<div id="screen-guardadas" class="screen"></div>

<script>
// ============================================================================
// MOTOR DE CÁLCULO — Scoring PRODUCCIÓN
// Fórmulas portadas desde Evaluacion_Credito_Individual_Producción.xlsx
// ============================================================================

const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmtBs(v){ if(!isFinite(v)) return '—'; return 'Bs. ' + v.toLocaleString('es-BO',{maximumFractionDigits:0}); }
function fmtPct(v){ if(!isFinite(v)) return '—'; return (v*100).toLocaleString('es-BO',{maximumFractionDigits:1}) + '%'; }
function fmtNum(v,d=2){ if(!isFinite(v)) return '—'; return v.toLocaleString('es-BO',{maximumFractionDigits:d}); }

// ---- Modalidad de pago -> nro de meses por periodo ----
function mesesPorPeriodo(modalidad){
  return {Mensual:1, Bimestral:2, Trimestral:3, Semestral:6, Anual:12}[modalidad] || 1;
}

// PMT estilo Excel: cuota de un préstamo sistema francés
function PMT(ratePerPeriod, nPeriods, presentValue){
  if (nPeriods <= 0) return 0;
  if (ratePerPeriod === 0) return presentValue / nPeriods;
  const r = ratePerPeriod;
  return (presentValue * r * Math.pow(1+r, nPeriods)) / (Math.pow(1+r, nPeriods) - 1);
}

// ============================================================================
// DATOS DEL CLIENTE — cálculos derivados
// ============================================================================
function mesIndexDeFecha(fechaStr){
  const d = fechaStr ? new Date(fechaStr) : new Date();
  const idx = isNaN(d.getTime()) ? 0 : d.getMonth();
  return idx; // 0=Ene ... 11=Dic, alineado con MESES y arrays de estacionalidad
}

// El primer mes del Flujo proyectado es el que corresponde a 45 días después de
// la Fecha de Evaluación (tiempo estimado de desembolso), no necesariamente Enero.
function mesInicioProyectado(fechaStr){
  const d = fechaStr ? new Date(fechaStr) : new Date();
  if (isNaN(d.getTime())) return 0;
  const d2 = new Date(d.getTime());
  d2.setDate(d2.getDate() + 45);
  return d2.getMonth(); // 0=Ene ... 11=Dic
}

function calcCliente(S){
  const c = S.negocio, cr = S.credito;
  const diasMes = num(c.diasSemana) * num(c.semanasMes);

  // Inventario de mercadería (capital)
  let totalInventario = 0;
  (S.inventario||[]).forEach(r => totalInventario += num(r.cantidad) * num(r.precioUnit));

  // Costo de ventas / mes (mercadería vendida mensualmente — CMV base)
  let totalCostoVentasMes = 0;
  (S.costoVentasMes||[]).forEach(r => totalCostoVentasMes += num(r.frecuencia) * num(r.cantidad) * num(r.precioUnit));

  // Ventas Base "cruda": ventas diarias declaradas x días/mes, normalizada por el
  // factor de estacionalidad del MES DE EVALUACIÓN (se vuelve a multiplicar por
  // el factor de cada mes en el flujo — ver calcFlujo)
  const seas = (SEASONALITY[S.negocio.actividad] || Array(12).fill(1));
  const mesEvalIdx = mesIndexDeFecha(S.meta.fecha);
  const factorEval = seas[mesEvalIdx] || 1;

  // Ingresos diarios por tipo de servicio (si se cargó el detalle)
  let totalServiciosDia = 0;
  (S.servicios||[]).forEach(s => totalServiciosDia += num(s.ingresoDia));

  // Ventas Base "cruda": suma de Ingresos/día por tipo de servicio x Días/mes (si hay
  // detalle cargado), si no, Ventas Diarias x Días/mes — normalizada por el factor de
  // estacionalidad del MES DE EVALUACIÓN
  const ventasBaseSinNormalizar = totalServiciosDia > 0
    ? totalServiciosDia * diasMes
    : num(c.ventasDiarias) * diasMes;
  const ventasBaseRaw = factorEval ? ventasBaseSinNormalizar / factorEval : 0;

  const gastoAlimentacionFlia = num(c.costoMinAliment) * num(S.cliente.dependientes||0) * 30;

  // Crédito: cuotas — la cuota se calcula sobre el PERÍODO real de pago según
  // la Modalidad (Mensual/Bimestral/Trimestral/Semestral/Anual). Para el Flujo
  // de Caja (columnas mensuales) se usa el equivalente MENSUAL de esa cuota
  // periódica, de modo que el DSCR y la carga mensual sean comparables entre
  // modalidades. Se expone también la cuota periódica real (cuotaPeriodica) y
  // el número de meses por período (mpp) para mostrarla tal cual en Condiciones.
  const mpp = mesesPorPeriodo(cr.modalidadPago);
  const nCuotas = mpp>0 ? (num(cr.plazoMeses)/mpp) : 0;
  const tasaPeriodo = (num(cr.tasaInteres)/12) * mpp;
  const cuotaGraciaPeriodica = num(cr.monto) * tasaPeriodo;
  const cuotaGracia = mpp>0 ? cuotaGraciaPeriodica/mpp : cuotaGraciaPeriodica;
  const cuotaPeriodica = (() => {
    const nCuotasNormales = mpp>0 ? (num(cr.plazoMeses) - num(cr.mesesGracia))/mpp : 0;
    if (tasaPeriodo === 0 || nCuotasNormales<=0) return nCuotasNormales>0 ? num(cr.monto)/nCuotasNormales : 0;
    return (num(cr.monto) * tasaPeriodo * Math.pow(1+tasaPeriodo, nCuotasNormales)) / (Math.pow(1+tasaPeriodo, nCuotasNormales) - 1);
  })();
  const cuotaAmort = mpp>0 ? cuotaPeriodica/mpp : cuotaPeriodica;

  return { diasMes, totalInventario, totalCostoVentasMes, totalServiciosDia, ventasBaseRaw, mesEvalIdx, factorEval,
           gastoAlimentacionFlia, mpp, nCuotas, tasaPeriodo, cuotaGracia, cuotaGraciaPeriodica, cuotaAmort, cuotaPeriodica };
}

// ============================================================================
// FLUJO DE CAJA MENSUAL PROYECTADO
// ============================================================================
function calcFlujo(S, ventaAdoptada){
  const cc = calcCliente(S);
  const seas = (SEASONALITY[S.negocio.actividad] || Array(12).fill(1));
  const ventasContadoPct = num(S.negocio.ventasContado || 0.9);
  // Servicios: fórmula VERIFICADA en el Excel real (FLUJO SERVICIOS!B18) =
  // (VentasBase × FactorEstacional + VentaAdoptada) / 2 — a diferencia de
  // Comercio/Producción, aquí la Venta Adoptada NO se escala por estacionalidad.
  const va = num(ventaAdoptada);

  const mesInicio = mesInicioProyectado(S.meta.fecha);
  const meses = Array.from({length:12}, (_, i) => {
    const mIdx = (mesInicio + i) % 12; // mes calendario real (para estacionalidad correcta)
    const m = MESES[mIdx];
    const ventasTotales = va>0 ? (cc.ventasBaseRaw*seas[mIdx] + va)/2 : cc.ventasBaseRaw*seas[mIdx];
    const ventasContado = ventasTotales * ventasContadoPct;
    const ventasCredito = ventasTotales * (1 - ventasContadoPct);
    const otrosIngresos = num(S.flujoGastos.otrosIngresos);
    const totalIngresos = ventasContado + ventasCredito + otrosIngresos;

    // CMV: el costo de mercadería/mes declarado se escala con la misma estacionalidad
    // que las ventas (a mayor venta en el mes, mayor consumo de mercadería, en la misma proporción)
    // A diferencia de Comercio/Producción, en Servicios el Costo de Ventas (Insumos/
    // Materiales del Servicio) es un valor FIJO cada mes en el Excel — no se escala
    // por estacionalidad (verificado: FLUJO SERVICIOS!C25='=B25', copiado tal cual).
    const cmvAjustado = cc.totalCostoVentasMes;

    const utilidadBruta = totalIngresos - cmvAjustado;

    const g = S.flujoGastos;
    const gastosOperativos = num(g.alquiler)+num(g.sueldoProp)+num(g.sueldoPersonal)+num(g.luz)+num(g.agua)
      +num(g.telefono)+num(g.transporteMerc)+num(g.combustible)+num(g.publicidad)+num(g.mantenimiento)
      +num(g.transporteFlete)+num(g.gastosAdmin)+num(g.otrosGastos);

    const utilidadOperativa = utilidadBruta - gastosOperativos;

    const oi = S.otrosIngresos||{};
    const subtotalOtrosIngresos = num(oi.agricola)+num(oi.produccion)+num(oi.comercio)+num(oi.salarios);

    const gf = S.gastosFamiliares||{};
    const totalGastosFamiliares = num(gf.alimentacion || cc.gastoAlimentacionFlia)+num(gf.alquilerVivienda)+num(gf.agua)
      +num(gf.energia)+num(gf.telefono)+num(gf.gas)+num(gf.salud)+num(gf.transporte)+num(gf.combustible)
      +num(gf.educacion)+num(gf.vestimenta)+num(gf.previsiones)+num(gf.impuestos)+num(gf.otros)
      +num(gf.cuota1)+num(gf.cuota2)+num(gf.cuota3);

    const saldoDisponible = utilidadOperativa + subtotalOtrosIngresos - totalGastosFamiliares;

    const enGracia = (i < num(S.credito.mesesGracia));
    const mpp = cc.mpp || 1;
    // La cuota se cobra solo en los meses de pago reales según la Modalidad
    // (ej. Bimestral = cada 2 meses); el resto de los meses la cuota es 0.
    const esMesDePago = enGracia
      ? ((i+1) % mpp === 0)
      : (((i - num(S.credito.mesesGracia) + 1)) % mpp === 0);
    const cuota = !esMesDePago ? 0 : (enGracia ? cc.cuotaGraciaPeriodica : cc.cuotaPeriodica);
    const interes = num(S.credito.monto) * (num(S.credito.tasaInteres)/12);
    const amortCapital = enGracia ? 0 : Math.max(cuota - interes, 0);

    const capacidadPago = saldoDisponible - cuota;
    const coberturaCuota = cuota > 0 ? saldoDisponible/cuota : 0;
    const dti = totalIngresos > 0 ? cuota/totalIngresos : 0;
    const margenBruto = totalIngresos > 0 ? utilidadBruta/totalIngresos : 0;
    const margenOperativo = totalIngresos > 0 ? utilidadOperativa/totalIngresos : 0;
    const rotacionInventario = cc.totalInventario > 0 ? cmvAjustado/cc.totalInventario : 0;
    const puntoEquilibrio = margenBruto > 0 ? gastosOperativos/margenBruto : 0;

    return { mes:m, factorEstacional: seas[mIdx], ventasTotales, ventasContado, ventasCredito, otrosIngresos, totalIngresos,
      cmv: cmvAjustado, utilidadBruta, gastosOperativos, utilidadOperativa, subtotalOtrosIngresos,
      totalGastosFamiliares, saldoDisponible, cuota, interes, amortCapital, capacidadPago,
      coberturaCuota, dti, margenBruto, margenOperativo, rotacionInventario, puntoEquilibrio };
  });

  // Saldo Disponible Acumulado (Flujo Acumulado Consolidado) — suma corrida de Capacidad de Pago
  let acumulado = 0;
  meses.forEach(m => { acumulado += m.capacidadPago; m.saldoAcumulado = acumulado; });

  const prom = (key) => meses.reduce((a,m)=>a+m[key],0)/12;
  const promedios = {
    ventasTotales: prom('ventasTotales'), utilidadBruta: prom('utilidadBruta'),
    utilidadOperativa: prom('utilidadOperativa'), saldoDisponible: prom('saldoDisponible'),
    coberturaCuota: prom('coberturaCuota'), dti: prom('dti'), margenBruto: prom('margenBruto'), margenOperativo: prom('margenOperativo'),
    rotacionInventario: prom('rotacionInventario'), puntoEquilibrio: prom('puntoEquilibrio'),
    cmv: prom('cmv'), gastosOperativos: prom('gastosOperativos'), subtotalOtrosIngresos: prom('subtotalOtrosIngresos'),
    totalGastosFamiliares: prom('totalGastosFamiliares'), cuota: prom('cuota'),
  };
  let claseDTI = 'ok';
  if (promedios.dti > 0.5) claseDTI='bad'; else if (promedios.dti > 0.35) claseDTI='warn';


  return { cc, meses, promedios, claseDTI };
}

// ============================================================================
// BALANCE GENERAL — horizontal (anterior vs actual), vertical y ratios
// ============================================================================
const BALANCE_LINEAS = [
  {grp:'activoCorriente', key:'caja', label:'Caja y Efectivo'},
  {grp:'activoCorriente', key:'bancos', label:'Bancos / Cuentas de Ahorro'},
  {grp:'activoCorriente', key:'inventario', label:'Inventario / Mercadería'},
  {grp:'activoCorriente', key:'cxc', label:'Cuentas por Cobrar (Clientes)'},
  {grp:'activoCorriente', key:'otros', label:'Otros Activos Corrientes'},
  {grp:'activoNoCorriente', key:'equipos', label:'Equipos / Maquinaria (valor neto)'},
  {grp:'activoNoCorriente', key:'mobiliario', label:'Mobiliario y Enseres'},
  {grp:'activoNoCorriente', key:'vehiculos', label:'Vehículos (valor neto)'},
  {grp:'activoNoCorriente', key:'inmuebles', label:'Inmuebles / Local Propio'},
  {grp:'activoNoCorriente', key:'otros', label:'Otros Activos No Corrientes'},
  {grp:'pasivoCorriente', key:'cxp', label:'Cuentas por Pagar (Proveedores)'},
  {grp:'pasivoCorriente', key:'cuotaSF', label:'Créditos SF — Cuota mensual actual'},
  {grp:'pasivoCorriente', key:'deudasComerciales', label:'Deudas Comerciales / Casas Comerciales'},
  {grp:'pasivoCorriente', key:'otros', label:'Otros Pasivos Corrientes'},
  {grp:'pasivoNoCorriente', key:'deudasLP', label:'Deudas LP > 1 año (créditos a plazo)'},
  {grp:'pasivoNoCorriente', key:'otros', label:'Otros Pasivos No Corrientes'},
  {grp:'patrimonio', key:'capitalInicial', label:'Capital Propio Inicial'},
  {grp:'patrimonio', key:'utilidadesRetenidas', label:'Utilidades Retenidas / Ahorros'},
  {grp:'patrimonio', key:'otrosAportes', label:'Otros Aportes de Capital'},
];

function sumGrupo(periodo, grp){
  const o = (periodo && periodo[grp]) || {};
  return Object.values(o).reduce((a,v)=>a+num(v),0);
}

function calcBalance(S, flujo){
  const ant = S.balance.anterior, act = S.balance.actual;

  const totalACant = sumGrupo(ant,'activoCorriente'), totalACact = sumGrupo(act,'activoCorriente');
  const totalANCant = sumGrupo(ant,'activoNoCorriente'), totalANCact = sumGrupo(act,'activoNoCorriente');
  const totalActivoAnt = totalACant+totalANCant, totalActivoAct = totalACact+totalANCact;

  const totalPCant = sumGrupo(ant,'pasivoCorriente'), totalPCact = sumGrupo(act,'pasivoCorriente');
  const totalPNCant = sumGrupo(ant,'pasivoNoCorriente'), totalPNCact = sumGrupo(act,'pasivoNoCorriente');
  const totalPasivoAnt = totalPCant+totalPNCant, totalPasivoAct = totalPCact+totalPNCact;

  const totalPatAnt = sumGrupo(ant,'patrimonio'), totalPatAct = sumGrupo(act,'patrimonio');
  const verificacion = Math.abs((totalPasivoAct+totalPatAct) - totalActivoAct) < 1;
  const verificacionAnt = Math.abs((totalPasivoAnt+totalPatAnt) - totalActivoAnt) < 1;

  // ---- Análisis horizontal línea por línea ----
  const horizontal = BALANCE_LINEAS.map(l => {
    const vAnt = num((ant[l.grp]||{})[l.key]);
    const vAct = num((act[l.grp]||{})[l.key]);
    const varBs = vAct - vAnt;
    const varPct = vAnt !== 0 ? varBs/vAnt : 0;
    return {...l, vAnt, vAct, varBs, varPct};
  });
  const totalesHorizontal = [
    {label:'TOTAL ACTIVO CORRIENTE', vAnt:totalACant, vAct:totalACact, varBs:totalACact-totalACant, varPct: totalACant? (totalACact-totalACant)/totalACant:0},
    {label:'TOTAL ACTIVO NO CORRIENTE', vAnt:totalANCant, vAct:totalANCact, varBs:totalANCact-totalANCant, varPct: totalANCant?(totalANCact-totalANCant)/totalANCant:0},
    {label:'TOTAL ACTIVO', vAnt:totalActivoAnt, vAct:totalActivoAct, varBs:totalActivoAct-totalActivoAnt, varPct: totalActivoAnt?(totalActivoAct-totalActivoAnt)/totalActivoAnt:0},
    {label:'TOTAL PASIVO CORRIENTE', vAnt:totalPCant, vAct:totalPCact, varBs:totalPCact-totalPCant, varPct: totalPCant?(totalPCact-totalPCant)/totalPCant:0},
    {label:'TOTAL PASIVO NO CORRIENTE', vAnt:totalPNCant, vAct:totalPNCact, varBs:totalPNCact-totalPNCant, varPct: totalPNCant?(totalPNCact-totalPNCant)/totalPNCant:0},
    {label:'TOTAL PASIVO', vAnt:totalPasivoAnt, vAct:totalPasivoAct, varBs:totalPasivoAct-totalPasivoAnt, varPct: totalPasivoAnt?(totalPasivoAct-totalPasivoAnt)/totalPasivoAnt:0},
    {label:'PATRIMONIO NETO', vAnt:totalPatAnt, vAct:totalPatAct, varBs:totalPatAct-totalPatAnt, varPct: totalPatAnt?(totalPatAct-totalPatAnt)/totalPatAnt:0},
  ];

  // ---- Análisis vertical (anterior % vs actual %, con tendencia) ----
  const vert = (vAntNum, vActNum) => {
    const pAnt = totalActivoAnt? vAntNum/totalActivoAnt:0;
    const pAct = totalActivoAct? vActNum/totalActivoAct:0;
    return {pAnt, pAct, tendencia: pAct>pAnt?'↑ Aumenta':'↓ Baja'};
  };
  const vertical = {
    ac: vert(totalACant, totalACact),
    anc: vert(totalANCant, totalANCact),
    pc: vert(totalPCant, totalPCact),
    pasivo: vert(totalPasivoAnt, totalPasivoAct),
    patrimonio: vert(totalPatAnt, totalPatAct),
  };

  // ---- Ratios financieros (período actual, con período anterior para comparar) ----
  const ventasMes = flujo ? flujo.promedios.ventasTotales : 0;
  const cmvMes = flujo ? flujo.meses.reduce((a,m)=>a+m.cmv,0)/12 : 0;
  const utilNetaMes = flujo ? flujo.promedios.saldoDisponible : 0;

  const ratio = (num_, den_) => den_? num_/den_ : 0;
  const ratiosDe = (tAC,tANC,tActivo,tPC,tPNC,tPasivo,tPat,inv,caja,bancos,cxc) => ({
    liquidezCorriente: ratio(tAC, tPC),
    pruebaAcida: ratio(tAC-inv, tPC),
    ratioEfectivo: ratio(caja+bancos, tPC),
    rotacionCxC: ratio(ventasMes, cxc),
    periodoCobro: ratio(30, ratio(ventasMes,cxc)),
    rotacionInventario: ratio(cmvMes, inv),
    deudaPatrimonio: ratio(tPasivo, tPat),
    endeudamientoTotal: ratio(tPasivo, tActivo),
    coberturaDeudaSF: ratio(0, ventasMes), // cuota SF corriente se agrega abajo
    roa: ratio(utilNetaMes, tActivo),
    roe: ratio(utilNetaMes, tPat),
  });
  const ratiosAct = ratiosDe(totalACact,totalANCact,totalActivoAct,totalPCact,totalPNCact,totalPasivoAct,totalPatAct,
    num(act.activoCorriente.inventario), num(act.activoCorriente.caja), num(act.activoCorriente.bancos), num(act.activoCorriente.cxc));
  ratiosAct.coberturaDeudaSF = ratio(num(act.pasivoCorriente.cuotaSF), ventasMes);

  return {
    totalACant, totalACact, totalANCant, totalANCact, totalActivoAnt, totalActivoAct,
    totalPCant, totalPCact, totalPNCant, totalPNCact, totalPasivoAnt, totalPasivoAct,
    totalPatAnt, totalPatAct, verificacion, verificacionAnt, horizontal, totalesHorizontal, vertical,
    ...ratiosAct,
    // alias usados por el resto de la app (equivalentes al período actual)
    totalActivo: totalActivoAct, totalPasivo: totalPasivoAct, totalPatrimonio: totalPatAct,
  };
}

// ============================================================================
// COLATERAL Y GARANTÍAS
// ============================================================================
// TIPOS_GARANTIA_DEFAULT está definido en data.js (se carga antes que este archivo)

function calcColateral(S){
  const garantias = S.colateral && S.colateral.garantias ? S.colateral.garantias : TIPOS_GARANTIA_DEFAULT.map(g=>({...g, valor:0}));
  let totalValor = 0, totalPonderado = 0;
  garantias.forEach(g => { totalValor += num(g.valor); totalPonderado += num(g.valor)*num(g.pctCobertura); });

  const monto = num(S.credito.monto);
  const ratioCoberturaBruta = monto? totalValor/monto : 0;
  const ratioCoberturaPonderada = monto? totalPonderado/monto : 0;
  const ltv = totalValor? monto/totalValor : 0;

  let clasificacion = 'Insuficiente — Denegar', clase='bad';
  if (ratioCoberturaBruta >= 1.5){ clasificacion='Excelente — Aprobable'; clase='ok'; }
  else if (ratioCoberturaBruta >= 1.0){ clasificacion='Adecuada — Proceder'; clase='ok'; }
  else if (ratioCoberturaBruta >= 0.75){ clasificacion='Mínima — Reforzar inventario'; clase='warn'; }

  // Inventario prendado (insumos de producción declarados en Datos del Cliente)
  const inv = S.inventario || [];
  const totalInventario = inv.reduce((a,r)=>a+num(r.cantidad)*num(r.precioUnit),0);

  return { garantias, totalValor, totalPonderado, ratioCoberturaBruta, ratioCoberturaPonderada, ltv,
    clasificacion, clase, totalInventario, inv };
}

// ============================================================================
// SCORING — 5 Cs del Crédito (1000 pts)
// ============================================================================
function calcScoring(S){
  const respuestas = S.scoring || {};
  let porCategoria = {};
  let total = 0;
  let pendientes = 0;
  const detalle = [];

  SCORING_CRITERIA.forEach(row => {
    if (row.type === 'cat'){
      porCategoria[row.label] = {ptsmax: row.ptsmax, obtenido: 0};
    } else {
      const respuesta = num(respuestas[row.id]);
      const sinResponder = !respuesta;
      if (sinResponder) pendientes++;
      const escalaClamp = sinResponder ? 0 : Math.min(Math.max(respuesta,1),4);
      let pts;
      if (escalaClamp===1) pts = row.ptsmax;
      else if (escalaClamp===2) pts = row.ptsmax/1.5;
      else if (escalaClamp===3) pts = row.ptsmax/2;
      else pts = 0; // 4 (Deficiente) o sin responder = 0 pts
      detalle.push({...row, escala:escalaClamp, pts, sinResponder});
      if (porCategoria[row.cat]) porCategoria[row.cat].obtenido += pts;
      total += pts;
    }
  });

  // Chequeo de MORA (1.1 historial deudor, 1.3 estado deudor, 1.4 estado codeudor, 1.5 estado garante)
  const e11 = num(respuestas['1.1'])||1, e13 = num(respuestas['1.3'])||1,
        e14 = num(respuestas['1.4'])||1, e15 = num(respuestas['1.5'])||1;
  let alertaMora = null;
  if (e11>=2 && e15>=2) alertaMora = 'SUSPENDER LA EVALUACIÓN — operación en mora como DEUDOR y como GARANTE';
  else if (e11>=2 && e14>=2) alertaMora = 'SUSPENDER LA EVALUACIÓN — operación en mora como DEUDOR y como CODEUDOR';
  else if (e14>=2 && e15>=2) alertaMora = 'SUSPENDER LA EVALUACIÓN — operación en mora como CODEUDOR y como GARANTE';
  else if (e11>=2) alertaMora = 'SUSPENDER LA EVALUACIÓN — operación en mora como DEUDOR';
  else if (e14>=2) alertaMora = 'SUSPENDER LA EVALUACIÓN — operación en mora como CODEUDOR';
  else if (e15>=2) alertaMora = 'SUSPENDER LA EVALUACIÓN — operación en mora como GARANTE';

  let categoriaRiesgo, riskClass;
  if (total>=800){ categoriaRiesgo='RIESGO BAJO'; riskClass='risk-1'; }
  else if (total>=600){ categoriaRiesgo='RIESGO MEDIO'; riskClass='risk-2'; }
  else if (total>=500){ categoriaRiesgo='RIESGO ALTO'; riskClass='risk-3'; }
  else { categoriaRiesgo='RIESGO MUY ALTO'; riskClass='risk-4'; }

  const pd = 1/(1+Math.exp((total-500)/40));

  return { detalle, porCategoria, total, categoriaRiesgo, riskClass, pd, alertaMora, pendientes };
}

// ============================================================================
// RESOLUCIÓN — RAC (Rentabilidad Ajustada al Capital) + Scoring Final Consolidado
// ============================================================================
function calcResolucion(S, scoring, flujo, colateral){
  const monto = num(S.credito.monto);
  const plazo = num(S.credito.plazoMeses);
  const tasa = num(S.credito.tasaInteres);
  const gastosAdmin = num(S.credito.gastosAdmin);
  const costoFinanciero = num(S.credito.costoFinanciero);
  const racRequerido = num(S.credito.racRequerido || 0.05);

  const ingresosIntereses = monto * tasa * (plazo/12);
  const costoFinancieroBs = monto * costoFinanciero * (plazo/12);
  const gastosAdminBs = monto * gastosAdmin * (plazo/12);
  // PE = PD (Probabilidad de Incumplimiento) x EAD (Exposición al Default / Capital en
  // Riesgo) x LGD (Pérdida en caso de Incumplimiento — reducida por la cobertura de
  // garantías: a mayor colateral, menor pérdida real si el crédito entra en mora)
  const ead = monto;
  const lgd = monto ? (monto - colateral.totalPonderado) / monto : 1.0;
  const perdidaEsperada = scoring.pd * ead * lgd;
  const resultadoNeto = ingresosIntereses - costoFinancieroBs - gastosAdminBs - perdidaEsperada;
  const racGenerado = monto ? resultadoNeto/monto : 0;
  const decisionRAC = racGenerado >= racRequerido;

  // ---- IV. Componentes del Scoring Final Consolidado (peso editable por el usuario) ----
  const pesos = Object.assign({c1:0.3, c2:0.3, c3:0.2, c4:0.2}, S.pesosConsolidado||{});
  const coberturaCuotaProm = flujo.promedios.coberturaCuota;
  const pm1 = pesos.c1*1000, pm2 = pesos.c2*1000, pm3 = pesos.c3*1000, pm4 = pesos.c4*1000;
  const comp1 = scoring.total>=800 ? pm1 : (scoring.total>=600 ? pm1/1.5 : pm1/2);
  const comp2 = coberturaCuotaProm>=2 ? pm2 : (coberturaCuotaProm>=1.5 ? pm2/1.5 : (coberturaCuotaProm>=0.5 ? pm2/2 : pm2*0.208));
  const comp3 = racGenerado>=0.059 ? pm3 : (racGenerado>=0.05 ? pm3/1.5 : 0);
  const comp4 = scoring.pd<=0.01 ? pm4 : pm4/1.5;
  const semaf = (obtenido, ptsMax, okRatio, warnRatio) =>
    obtenido>=ptsMax*okRatio ? '✔' : (obtenido>=ptsMax*warnRatio ? '⚠' : '✘');
  const componentes = [
    {n:1, nombre:'Score 5Cs del Crédito', desc:'Carácter, Capacidad, Capital, Condiciones, Colateral', peso:pesos.c1, ptsMax:pm1, obtenido:comp1, semaforo: semaf(comp1,pm1,1.0,0.667)},
    {n:2, nombre:'Cobertura de Cuota (SD/Cuota)', desc:'Saldo Disponible / Cuota — indicador principal capacidad de pago', peso:pesos.c2, ptsMax:pm2, obtenido:comp2, semaforo: semaf(comp2,pm2,0.667,0.5)},
    {n:3, nombre:'RAC — Rentabilidad Ajustada al Capital', desc:'Viabilidad financiera de la operación para la IMF', peso:pesos.c3, ptsMax:pm3, obtenido:comp3, semaforo: semaf(comp3,pm3,0.375,0.25)},
    {n:4, nombre:'Probabilidad de Default (PD Mora)', desc:'Probabilidad de que la operación entre en mora', peso:pesos.c4, ptsMax:pm4, obtenido:comp4, semaforo: semaf(comp4,pm4,0.2,0.125)},
  ];
  const sumPesos = pesos.c1+pesos.c2+pesos.c3+pesos.c4;
  const totalPtsMax = pm1+pm2+pm3+pm4;
  const scoreFinal = comp1+comp2+comp3+comp4;
  let categoriaFinal, categoriaFinalClase;
  if (scoreFinal>=totalPtsMax*0.8){ categoriaFinal='✔ RIESGO BAJO — APROBABLE'; categoriaFinalClase='risk-1'; }
  else if (scoreFinal>=totalPtsMax*0.6){ categoriaFinal='⚠ RIESGO MEDIO — CONDICIONES'; categoriaFinalClase='risk-2'; }
  else if (scoreFinal>=totalPtsMax*0.5){ categoriaFinal='⚠ RIESGO ALTO — COMITÉ'; categoriaFinalClase='risk-3'; }
  else { categoriaFinal='✘ RIESGO MUY ALTO — RECHAZAR'; categoriaFinalClase='risk-4'; }

  // ---- V. Semáforo Ejecutivo (8 indicadores) ----
  const semaforo = [
    {n:1, indicador:'Score 5Cs ASFI', estado: scoring.total>=800?'✔ SCORE ALTO':(scoring.total>=600?'⚠ SCORE MEDIO':'✘ SCORE BAJO'), valor: fmtNum(scoring.total,0)+' / 1000 pts'},
    {n:2, indicador:'Score Final Consolidado', estado: scoreFinal>=totalPtsMax*0.8?'✔ SCORE ALTO':(scoreFinal>=totalPtsMax*0.6?'⚠ SCORE MEDIO':'✘ SCORE BAJO'), valor: fmtNum(scoreFinal,1)+' / '+fmtNum(totalPtsMax,0)+' pts'},
    {n:3, indicador:'Cobertura Cuota SD/Cuota', estado: coberturaCuotaProm>=1.5?'✔ CUOTA CUBIERTA':'✘ CUOTA INSUFICIENTE', valor: Math.trunc(coberturaCuotaProm)+' Veces'},
    {n:4, indicador:'RAC Generado vs Requerido', estado: racGenerado>=racRequerido?'✔ RAC SATISFACTORIO':'✘ RAC INSUFICIENTE', valor: fmtPct(racGenerado)+' vs '+fmtPct(racRequerido)+' mín'},
    {n:5, indicador:'Colateral / Cobertura', estado: colateral.totalValor>=monto?'✔ GARANTÍA OK':'⚠ GARANTÍA INSUFICIENTE', valor: fmtBs(colateral.totalValor)+' de cobertura'},
    {n:6, indicador:'Mora en SF como Deudor', estado: (num(S.scoring['1.1'])||1)===1?'✔ SIN MORA':'✘ EN MORA — REQUIERE REVISIÓN', valor:'Ver INFOCRED - ASFI'},
    {n:7, indicador:'Antigüedad del Negocio', estado: num(S.negocio.antiguedad)>=3?'✔ NEGOCIO MADURO':(num(S.negocio.antiguedad)>=1?'⚠ EN DESARROLLO':'✘ NEGOCIO NUEVO'), valor: num(S.negocio.antiguedad)+' años'},
    {n:8, indicador:'Probabilidad Default (Mora)', estado: scoring.pd<=0.01?'✔ PROBABILIDAD DE MORA BAJA':'✘ PROBABILIDAD DE MORA ALTA', valor: fmtPct(scoring.pd)},
  ];

  // ---- VI. Condiciones Crediticias Recomendadas ----
  let tier, montoAprobado;
  if (scoreFinal>=totalPtsMax*0.8){ tier='APROBADO'; montoAprobado=monto; }
  else if (scoreFinal>=totalPtsMax*0.6){ tier='CON CONDICIONES'; montoAprobado=monto*0.9; }
  else if (scoreFinal>=totalPtsMax*0.5){ tier='DIFERIDO A COMITÉ'; montoAprobado=monto*0.7; }
  else { tier='RECHAZADO'; montoAprobado=0; }
  const nivelAprobacion = scoreFinal>=totalPtsMax*0.8?'Asesor de Crédito':(scoreFinal>=totalPtsMax*0.6?'Jefe de Agencia':(scoreFinal>=totalPtsMax*0.5?'Comité de Crédito':'No aplica — Rechazado'));
  const seguimiento = scoreFinal>=totalPtsMax*0.8?'Trimestral':(scoreFinal>=totalPtsMax*0.6?'Mensual (primeros 3 meses)':'Quincenal — monitoreo estricto');

  return { ingresosIntereses, costoFinancieroBs, gastosAdminBs, perdidaEsperada, resultadoNeto, ead, lgd,
    racGenerado, racRequerido, decisionRAC,
    componentes, scoreFinal, categoriaFinal, categoriaFinalClase, semaforo,
    tier, montoAprobado, nivelAprobacion, seguimiento, pesos, sumPesos, totalPtsMax };
}

// ============================================================================
// IV. ANÁLISIS HISTÓRICO DE VENTAS — Estimaciones A-E (Pasada 1, sin flujo)
// ============================================================================
function calcVentasEstimaciones(S, cc){
  const vh = S.ventasHist || {};
  const diasSemana = num(S.negocio.diasSemana) || 7;
  const diasMes = cc.diasMes || (diasSemana*4);

  const sB = vh.semanasBRM || {buena:{venta:0,n:4}, regular:{venta:0,n:4}, mala:{venta:0,n:4}};
  const semMensual = {
    buena: num(sB.buena.venta)*num(sB.buena.n),
    regular: num(sB.regular.venta)*num(sB.regular.n),
    mala: num(sB.mala.venta)*num(sB.mala.n),
  };
  const estB = (semMensual.buena+semMensual.regular+semMensual.mala)/3;

  const dB = vh.diasBRM || {buena:0, regular:0, mala:0};
  const diaCalc = (venta, semanasRef) => { const sem = venta*diasSemana; return {venta, semanal: sem, mensual: sem*semanasRef}; };
  const d1 = diaCalc(num(dB.buena), num(sB.buena.n));
  const d2 = diaCalc(num(dB.regular), num(sB.regular.n));
  const d3 = diaCalc(num(dB.mala), num(sB.mala.n));
  const estA = (d1.mensual+d2.mensual+d3.mensual)/3;

  const s2 = vh.semanas2 || {s1:0, s2:0};
  const sem1Diaria = diasSemana? num(s2.s1)/diasSemana : 0;
  const sem2Diaria = diasSemana? num(s2.s2)/diasSemana : 0;
  const estC = (num(s2.s1)*4 + num(s2.s2)*4)/2;

  const caja = vh.caja || {efectivo:0, diasCorresponde:0};
  const ventaDiariaCaja = num(caja.diasCorresponde)? num(caja.efectivo)/num(caja.diasCorresponde) : 0;
  const estD = ventaDiariaCaja * diasMes;

  const resp = vh.respaldo || [0,0,0,0];
  const respPositivos = resp.map(num).filter(v=>v>0);
  const estE = respPositivos.length ? respPositivos.reduce((a,b)=>a+b,0)/respPositivos.length : 0;

  const estimaciones = [
    {label:'A - Por Días (B/R/M)', valor: estA, peso:0.25},
    {label:'B - Por Semanas (B/R/M)', valor: estB, peso:0.25},
    {label:'C - Histórico Semanal', valor: estC, peso:0.2},
    {label:'D - Caja / Disponible', valor: estD, peso:0.15},
    {label:'E - Registros con Respaldo', valor: estE, peso:0.15},
  ];
  const conDatos = estimaciones.filter(e=>e.valor>0);
  const sumPesos = conDatos.reduce((a,e)=>a+e.peso,0) || 1;
  const ventaAdoptada = conDatos.length ? conDatos.reduce((a,e)=>a+e.valor*e.peso,0)/sumPesos : 0;
  const promedioSimple = estimaciones.reduce((a,e)=>a+e.valor,0)/5;
  estimaciones.forEach(e=>{
    e.desviacion = ventaAdoptada? Math.abs(e.valor-ventaAdoptada)/ventaAdoptada : 0;
    e.calidad = e.desviacion<=0.1?'✔ Consistente':(e.desviacion<=0.25?'⚠ Moderado':'✘ Inconsistente');
  });

  return { d1,d2,d3, estA, estB, estC, estD, estE, semMensual, sem1Diaria, sem2Diaria,
    estimaciones, promedioSimple, ventaAdoptada, diasSemana, diasMes, caja };
}

// ============================================================================
// IV.7-8 Cruces de Información (Pasada 2, requiere flujo + balance)
// ============================================================================
function calcVentasCruces(S, flujo, balance, cc, est){
  const c = (S.ventasHist||{}).cruces || {};
  const { diasMes, sem1Diaria, ventaAdoptada, caja } = est;

  const cruce1_dato1 = diasMes? ventaAdoptada/diasMes : 0;
  const cruce1_dato2 = sem1Diaria;
  const cruce1_ratio = cruce1_dato2? cruce1_dato1/cruce1_dato2 : 0;
  const cruce1_ok = Math.abs(1-cruce1_ratio)<=0.15 ? '✔ CONSISTENTE' : (Math.abs(1-cruce1_ratio)<=0.25?'⚠ VERIFICAR':'✘ INCONSISTENTE');

  const cruce2_ratio = flujo.promedios.saldoDisponible ? num(c.utilidadDeclarada)/flujo.promedios.saldoDisponible : 0;
  const cruce2_ok = Math.abs(1-cruce2_ratio)<=0.2 ? '✔ CONSISTENTE' : '⚠ VERIFICAR';

  const cruce3_ratio = flujo.promedios.ventasTotales ? num(c.gastosFamDeclarados)/flujo.promedios.ventasTotales : 0;
  const cruce3_ok = cruce3_ratio<=0.7 ? '✔ OK' : '⚠ REVISAR gastos';

  const cruce4_ratio = num(c.ahorroDeclarado) ? num(c.excedenteDeclarado)/num(c.ahorroDeclarado) : 0;
  const cruce4_ok = cruce4_ratio>=0.2 ? '✔ CAPITALIZA' : '⚠ REVISAR';

  const cruce5_ratio = cc.totalCostoVentasMes ? num(c.comprasDeclaradas)/cc.totalCostoVentasMes : 0;
  const cruce5_ok = (cruce5_ratio>=0.3 && cruce5_ratio<=0.7) ? '✔ OK' : '⚠ REVISAR margen';

  const cruce6_ratio = cruce1_dato1 ? num(caja.efectivo)/cruce1_dato1 : 0;
  const cruce6_ok = (cruce6_ratio>=2 && cruce6_ratio<=7) ? '✔ OK' : (cruce6_ratio<2?'⚠ POCO EFECTIVO':'⚠ EXCESO CAJA');

  const cruce7_ratio = balance.rotacionInventario;
  const cruce7_ok = cruce7_ratio<=30 ? '✔ OK' : '⚠ Ciclo largo';

  const cruce8_diff = num(c.plazoCxCDeclarado) - num(c.plazoCxCEstimado);
  const cruce8_ok = Math.abs(cruce8_diff)<=5 ? '✔ CONSISTENTE' : '⚠ VERIFICAR incobrables';

  return [
    {n:1, label:'Ventas Diarias vs. Venta Semanal Histórica', dato1:cruce1_dato1, dato2:cruce1_dato2, resultado:cruce1_ratio, parametro:'0.85-1.15', estado:cruce1_ok},
    {n:2, label:'Utilidad Declarada vs. Utilidad Evaluación', dato1:num(c.utilidadDeclarada), dato2:flujo.promedios.saldoDisponible, resultado:cruce2_ratio, parametro:'0.8-1.2', estado:cruce2_ok},
    {n:3, label:'Gastos Familiares vs. Ingreso', dato1:num(c.gastosFamDeclarados), dato2:flujo.promedios.ventasTotales, resultado:cruce3_ratio, parametro:'<= 70%', estado:cruce3_ok},
    {n:4, label:'Excedente Familiar vs. Ahorro/Capitalización', dato1:num(c.excedenteDeclarado), dato2:num(c.ahorroDeclarado), resultado:cruce4_ratio, parametro:'>= 20%', estado:cruce4_ok},
    {n:5, label:'Ventas Declaradas vs. Compras Declaradas (CMV)', dato1:num(c.comprasDeclaradas), dato2:cc.totalCostoVentasMes, resultado:cruce5_ratio, parametro:'30-70%', estado:cruce5_ok},
    {n:6, label:'Caja / Venta Diaria (días mínimos operación)', dato1:num(caja.efectivo), dato2:cruce1_dato1, resultado:cruce6_ratio, parametro:'2-7 días', estado:cruce6_ok},
    {n:7, label:'Rotación de Inventario (ciclo)', dato1:cruce7_ratio, dato2:null, resultado:cruce7_ratio, parametro:'<30 días', estado:cruce7_ok},
    {n:8, label:'Plazo CxC Declarado vs. Estimado', dato1:num(c.plazoCxCDeclarado), dato2:num(c.plazoCxCEstimado), resultado:cruce8_diff, parametro:'< 5 días dif.', estado:cruce8_ok},
  ];
}

// ============================================================================
// ANÁLISIS IA — Motor de decisión basado en reglas (dictamen automático,
// diagnóstico narrativo y factores de riesgo). Portado de la hoja "ANALISIS IA".
// ============================================================================
function calcAnalisisIA(S, scoring, resolucion, flujo){
  const K79 = scoring.total;
  const dictamen = K79>=800 ? `DICTAMEN IA: CRÉDITO APROBADO | Score: ${fmtNum(K79,0)} pts | RAC: ${fmtPct(resolucion.racGenerado)} | Riesgo Bajo | Proceder con desembolso`
    : K79>=600 ? `DICTAMEN IA: APROBADO CON CONDICIONES | Score: ${fmtNum(K79,0)} pts | RAC: ${fmtPct(resolucion.racGenerado)} | Riesgo Medio | Aplicar restricciones`
    : K79>=500 ? `DICTAMEN IA: REQUIERE ANÁLISIS ADICIONAL | Score: ${fmtNum(K79,0)} pts | Riesgo Alto | Elevar a Comité de Crédito`
    : `DICTAMEN IA: RECHAZADO | Score: ${fmtNum(K79,0)} pts | Riesgo Muy Alto | No cumple parámetros ASFI`;

  const diagnostico = K79>=800
    ? 'PERFIL CREDITICIO SÓLIDO: Indicadores financieros saludables. Score ≥800 pts = bajo riesgo de incumplimiento. Capacidad de pago verificada. RAC positivo confirma viabilidad para la IFD. ACCIÓN: Proceder con desembolso. Seguimiento: Trimestral.'
    : K79>=600
    ? 'PERFIL CON OBSERVACIONES: Riesgo Moderado. Ingresos con variabilidad o historial con observaciones. ACCIONES: 1) Reducir monto 80-90% 2) Garantía adicional 3) Seguimiento mensual 3 meses 4) Verificar referencias.'
    : K79>=500
    ? 'RIESGO ELEVADO: Capacidad ajustada, sector vulnerable o mora en historial. ACCIONES: 1) Elevar a Comité de Crédito 2) Garantía real/hipotecaria 3) Reducir monto 50-70% 4) Plazo corto máximo 5) Reevaluar en 3-6 meses.'
    : 'RECHAZO RECOMENDADO: Score insuficiente según parámetros ASFI para IFDs. Causas probables: mora, sobreendeudamiento, sector muy vulnerable o RAC negativo. Reevaluar en 6 meses con mejoras documentadas.';

  const condiciones = {
    monto: K79>=800 ? num(S.credito.monto) : K79>=600 ? num(S.credito.monto)*0.9 : K79>=500 ? num(S.credito.monto)*0.7 : 0,
    plazo: K79>=800 ? num(S.credito.plazoMeses) : K79>=600 ? num(S.credito.plazoMeses) : K79>=500 ? Math.min(num(S.credito.plazoMeses),6) : 0,
    tasa: K79>=800 ? num(S.credito.tasaInteres)*0.95 : K79>=600 ? num(S.credito.tasaInteres) : num(S.credito.tasaInteres)*1.05,
    garantia: K79>=800 ? 'Según política interna' : K79>=600 ? 'Garantía prendaria o codeudor' : 'Garantía hipotecaria obligatoria',
    seguimiento: K79>=800 ? 'Trimestral' : K79>=600 ? 'Mensual (primeros 3 meses)' : 'Quincenal — monitoreo estricto',
    nivelAprobacion: K79>=800 ? 'Asesor de Crédito' : K79>=600 ? 'Jefe de Agencia' : K79>=500 ? 'Comité de Crédito' : 'No aplica — Rechazado',
  };

  const factorLogro = (obtenido, max) => max? obtenido/max : 0;
  const diag1 = (r,textos) => r>=0.85?textos[0]:(r>=0.7?textos[1]:textos[2]);
  const cat = scoring.porCategoria;
  const factores = [
    {factor:'Carácter e Historial', cat:'1. CARACTER',
      diagnostico: diag1(factorLogro(cat['1. CARACTER']?.obtenido, cat['1. CARACTER']?.ptsmax),
        ['Excelente historial crediticio — Bajo riesgo','Historial aceptable con observaciones','Historial deficiente — Factor de riesgo crítico'])},
    {factor:'Capacidad de Pago', cat:'2. CAPACIDAD DE PAGO',
      diagnostico: diag1(factorLogro(cat['2. CAPACIDAD DE PAGO']?.obtenido, cat['2. CAPACIDAD DE PAGO']?.ptsmax),
        ['Capacidad de pago sólida y verificada','Capacidad ajustada — monitorear DTI','Capacidad insuficiente — Riesgo de mora elevado'])},
    {factor:'Capital y Patrimonio', cat:'3. CAPITAL',
      diagnostico: diag1(factorLogro(cat['3. CAPITAL']?.obtenido, cat['3. CAPITAL']?.ptsmax),
        ['Patrimonio sólido, bajo endeudamiento','Patrimonio moderado — controlar deuda','Endeudamiento elevado — revisar estructura financiera'])},
    {factor:'Condiciones del Entorno', cat:'4. CONDICIONES',
      diagnostico: diag1(factorLogro(cat['4. CONDICIONES']?.obtenido, cat['4. CONDICIONES']?.ptsmax),
        ['Condiciones socioeconómicas favorables','Condiciones moderadas — vigilar sector','Condiciones adversas — riesgo de incumplimiento elevado'])},
    {factor:'Colateral y Garantías', cat:'5. COLATERAL',
      diagnostico: diag1(factorLogro(cat['5. COLATERAL']?.obtenido, cat['5. COLATERAL']?.ptsmax),
        ['Garantías suficientes y de calidad','Garantías parciales — reforzar colateral','Garantías insuficientes — alto riesgo de pérdida'])},
  ].map(f => ({...f, obtenido: cat[f.cat]?.obtenido||0, max: cat[f.cat]?.ptsmax||0,
    logro: factorLogro(cat[f.cat]?.obtenido, cat[f.cat]?.ptsmax)}));

  return { dictamen, diagnostico, condiciones, factores };
}

// ============================================================================
// III. DIAGNÓSTICO IA — Benchmark de 6 KPIs vs. rangos técnicos por actividad
// ============================================================================
function calcDiagnosticoIA(S, flujo, balance, scoring){
  const bench = DIAGNOSTICO_IA[S.negocio.actividad] || {};
  const rows = [
    {label:'Margen Bruto (%)', valor: flujo.promedios.margenBruto*100, fmt: v=>fmtNum(v,0)},
    {label:'Cobertura de Cuota (DSCR)', valor: flujo.promedios.coberturaCuota, fmt: v=>fmtNum(v,2)+'x'},
    {label:'Patrimonio (Bs)', valor: balance.totalPatAct, fmt: fmtBs},
    {label:'Probabilidad de Incumplimiento (PD %)', valor: scoring.pd*100, fmt: v=>fmtNum(v,1)+'%'},
  ];
  return rows.map(r => {
    const b = bench[r.label] || {};
    return { ...r, valorFmt: r.fmt(r.valor), min:b.min, obj:b.obj, max:b.max,
      impacto:b.impacto||'—', diagnostico:b.diagnostico||'Sin datos de referencia para esta actividad.' };
  });
}

// ============================================================================
// SUGERENCIAS AUTOMÁTICAS DE SCORING — criterios que ya se pueden calcular con
// los datos de Flujo, Balance y Colateral cargados, para no hacer perder tiempo
// al asesor volviendo a evaluar algo que el sistema ya sabe.
// ============================================================================
const AUTO_SCORING_IDS = ['2.1','2.6','2.7','5.2'];
function tier(v, t1, t2, t3){
  if (v>=t1) return 1;
  if (v>=t2) return 2;
  if (v>=t3) return 3;
  return 4;
}
function calcAutoSuggestions(S, flujo, balance, colateral){
  const sug = {};
  sug['2.1'] = tier(flujo.promedios.coberturaCuota, 2.0, 1.5, 0.5);
  sug['2.6'] = tier(balance.roa*100, 15, 10, 5);
  const coberturaPtoEq = flujo.promedios.puntoEquilibrio>0 ? flujo.promedios.ventasTotales/flujo.promedios.puntoEquilibrio : 0;
  sug['2.7'] = tier(coberturaPtoEq, 2.0, 1.5, 1.0);
  sug['5.2'] = tier(colateral.ratioCoberturaBruta*100, 150, 100, 75);
  return sug;
}

// ============================================================================
// V. CAPACIDAD DE PAGO BAJO INCERTIDUMBRE IA — stress test de flujo, resiliencia,
// score integral y decisión final. Portado íntegro de la hoja "INCERTIDUMBRE".
// ============================================================================
const INCLUYE_BANCOS_LIQUIDEZ = true; // Servicios: liquidez inmediata = Caja + Bancos (verificado en Excel)
function PV(rate, nper, pmt){
  if (rate === 0) return -pmt*nper;
  return -pmt * (1 - Math.pow(1+rate, -nper)) / rate;
}
function calcIncertidumbre(S, flujo, balance, colateral, scoring, resolucion){
  const inc = S.incertidumbre || {};
  const caidaVentas = num(inc.caidaVentas ?? 0.1);
  const aumentoCV = num(inc.aumentoCV ?? 0.05);
  const aumentoCF = num(inc.aumentoCF ?? 0.05);
  const aumentoGastosFam = num(inc.aumentoGastosFam ?? 0.05);
  const shockCambiario = num(inc.shockCambiario ?? 0);

  const b3 = flujo.promedios.ventasTotales;
  const b4 = flujo.promedios.cmv;
  const b5 = flujo.promedios.gastosOperativos;
  const b6 = flujo.promedios.subtotalOtrosIngresos;
  const b7 = flujo.promedios.totalGastosFamiliares;
  const b8 = 0.1; // Servicios: verificado en el Excel real — celda literal 0.1, no referencia al Balance
  const b9 = num(S.balance.actual.activoCorriente.caja);
  const b10 = num(S.balance.actual.activoCorriente.bancos);
  const b11 = num(S.balance.actual.activoCorriente.inventario);
  const b12 = num(S.balance.actual.activoCorriente.cxc);
  const b13 = balance.totalPatAct;
  const b14 = num(S.credito.monto);
  const b15 = num(S.credito.plazoMeses);
  const b16 = num(S.credito.tasaInteres);

  const b24 = b3-b4-b5+b6-b7;
  const b25 = b3*(1-caidaVentas);
  const b26 = b4*(1+aumentoCV+shockCambiario);
  const b27 = b5*(1+aumentoCF);
  const b28 = b6*(1+aumentoCF);
  const b29 = b7*(1+aumentoGastosFam);
  const b30 = b25-b26-b27-b29+b28;
  const b31 = Math.max(0, 1-((b8+b5+b7)/((b3-b4)||1)));

  const b33 = flujo.promedios.cuota;
  const b34 = b33+b8;
  const b35 = flujo.promedios.coberturaCuota; // = 'FLUJO'!N78 (cobertura de cuota promedio ya calculada)
  const b36 = b34===0 ? 99 : b30/b34;

  const b38 = INCLUYE_BANCOS_LIQUIDEZ ? b9+b10 : b9;
  const b47 = colateral.totalValor;
  const b48 = colateral.totalPonderado;
  const b39 = b38 + b11 + b12 + b48;
  const b40 = b8===0 ? 99 : b38/b34;
  const b41 = (b5+b7)===0 ? 99 : b39/(b5+b7);
  const b42 = b8===0 ? 99 : b13/((b33*12)||1);

  const clamp100 = v => Math.min(100, Math.max(0, v));
  const b43 = Math.round(
    clamp100(b35/2*100)*0.20 + clamp100(b36/1.5*100)*0.20 + clamp100(b31/0.4*100)*0.15 +
    clamp100(b40/6*100)*0.10 + clamp100(b41/6*100)*0.10 + clamp100(b42/3*100)*0.10 + 15
  );
  const b44 = b43>=80?'MUY ALTA':b43>=65?'ALTA':b43>=50?'MEDIA':'BAJA';

  const b51 = 1.2, b53 = 1.2, b57 = 350000;
  const b52 = Math.max(0, (b24/b51)-b8);
  const b54 = Math.max(0, (b30/b53)-b8);
  const b55 = b52<=0 ? 0 : PV(b16/12, b15, -b52);
  const b56 = b54<=0 ? 0 : PV(b16/12, b15, -b54);
  const b58 = Math.min(b55, b56, b57);

  const b61 = scoring.total;
  const b62 = clamp100(b61/10);
  const b63 = scoring.pd;
  const b64 = b63<=0.02?100:b63<=0.05?90:b63<=0.10?75:b63<=0.15?60:b63<=0.20?40:20;
  const b65 = b36;
  const b66 = b65>=2?100:b65>=1.5?90:b65>=1.2?80:b65>=1?60:b65>=0.8?30:0;
  const b67 = b43;
  const b68 = resolucion.perdidaEsperada;
  const b69 = resolucion.racGenerado;
  const b70 = b69>=0.20?100:b69>=0.15?90:b69>=0.10?75:b69>=0.05?60:b69>=0?40:0;

  const b78 = Math.round(b62*0.20 + b64*0.20 + b66*0.25 + b67*0.20 + b70*0.15);
  const b79 = b78>=80?'RIESGO BAJO':b78>=60?'RIESGO MEDIO':b78>=50?'RIESGO ALTO':'RIESGO MUY ALTO';

  const veto82 = b65<1, veto83 = b63>0.20, veto84 = b62<50, veto85 = b67<40, veto89 = (b68>0 && b69<0);
  const hayVeto = veto82||veto83||veto84||veto85||veto89;

  let b91;
  if (hayVeto) b91 = 'NO APROBABLE';
  else if (b78>=80) b91 = 'APROBABLE';
  else if (b78>=65) b91 = 'APROBABLE CON MITIGANTES';
  else b91 = 'REVISAR / AJUSTAR CRÉDITO';

  const b93 = b58;
  let b94;
  if (b36<1) b94 = 0;
  else if (b91==='APROBABLE' || b91==='APROBABLE CON MITIGANTES') b94 = b14;
  else if (b91==='REVISAR / AJUSTAR CRÉDITO') b94 = Math.min(b14, b93);
  else b94 = 0;

  const causaPrincipal = veto82?'DSCR bajo estrés insuficiente (<1.0x)'
    : veto83?'Probabilidad de Incumplimiento muy alta (>20%)'
    : veto84?'Score 5Cs insuficiente (<500 pts)'
    : veto85?'Resiliencia financiera muy baja (<40)'
    : veto89?'Pérdida esperada positiva con RAC negativo'
    : 'Ninguna — cumple todos los filtros mínimos';

  // B96-B99: textos exactos del Excel, verbatim según la decisión (B91)
  const medidaMitigacion = b91==='APROBABLE' ? 'No se requieren ajustes adicionales. Mantener las condiciones aprobadas y realizar el seguimiento normal.'
    : b91==='APROBABLE CON MITIGANTES' ? 'Mantener el crédito solicitado sujeto al cumplimiento de los mitigantes definidos y realizar seguimiento de los factores de riesgo.'
    : b91==='REVISAR / AJUSTAR CRÉDITO' ? 'Reducir monto y/o ajustar plazo y cuota hasta alcanzar capacidad adecuada bajo estrés.'
    : 'Suspender la aprobación y no otorgar una nueva exposición bajo las condiciones actuales.';

  const condicion = b91==='APROBABLE' ? 'Cumplir las condiciones generales de aprobación y documentación establecidas.'
    : b91==='APROBABLE CON MITIGANTES' ? 'Cumplir previamente los mitigantes definidos y las condiciones establecidas para la operación.'
    : b91==='REVISAR / AJUSTAR CRÉDITO' ? 'Reestructurar monto, plazo y/o cuota antes de aprobar. La nueva estructura deberá ser reevaluada.'
    : 'No aprobar ni desembolsar hasta que se superen las condiciones que originaron el resultado.';

  const controlPosterior = b91==='APROBABLE' ? 'Realizar seguimiento normal de la operación.'
    : b91==='APROBABLE CON MITIGANTES' ? 'Realizar seguimiento periódico de los mitigantes y de los principales indicadores de riesgo.'
    : b91==='REVISAR / AJUSTAR CRÉDITO' ? 'Actualizar información financiera y reevaluar capacidad de pago, DSCR bajo estrés, PD, resiliencia y RAC antes de una nueva aprobación.'
    : 'Realizar una nueva evaluación integral antes de considerar cualquier nueva exposición.';

  // ==========================================================================
  // DICTAMEN FINAL (B100) — motor de reestructuración con 2 alternativas (A/B),
  // portado íntegro de la hoja INCERTIDUMBRE. Se preservan tal cual dos rarezas
  // reales del archivo original: (1) el cálculo E324 queda dominado por -CuotaB33
  // y siempre resulta ≈1 (efecto matemático del propio diseño de la fórmula);
  // (2) el texto de "SELECCIÓN" está fijo a "OPCIÓN A" aunque el motor haya
  // elegido ALTERNATIVA B — así está escrito en el Excel.
  // ==========================================================================
  const pmtCalc = (rate, nper, pv) => {
    if (nper<=0) return 0;
    if (rate === 0) return pv/nper;
    return (pv*rate*Math.pow(1+rate,nper)) / (Math.pow(1+rate,nper)-1);
  };
  const nperCalc = (rate, pmtAbs, pv) => {
    if (pmtAbs<=0) return 0;
    if (rate === 0) return pv/pmtAbs;
    return Math.log(pmtAbs/(pmtAbs-pv*rate)) / Math.log(1+rate);
  };
  const e172 = b33, e173 = b36, e174 = 1.15;
  const e176 = Math.max(0, (b30/e174)-b8);
  const e177 = Math.max(0, e172-e176);
  const e178 = e173>=e174 ? 'CUMPLE' : 'REQUIERE AJUSTE';
  const e179 = e178==='CUMPLE'
    ? `El DSCR bajo estrés actual de ${fmtNum(e173,2)} veces alcanza el objetivo de ${fmtNum(e174,2)} veces. No se requiere ajuste por este criterio.`
    : `El DSCR bajo estrés debe mejorar de ${fmtNum(e173,2)} a ${fmtNum(e174,2)} veces. Para lograrlo, la cuota debe reducirse de Bs ${fmtBs(e172)} a aproximadamente Bs ${fmtBs(e176)}, generando una reducción estimada de Bs ${fmtBs(e177)}.`;

  const e181=b14, e182=b15, e183=b16, e184=e176;
  const e185 = Math.max(0, PV(e183/12, e182, -e184));
  const e188 = e185<=0 ? 0 : b30/(pmtCalc(e183/12, e182, e185)+b8);
  const e192=b14, e193=e184, e194=b15;
  const e195 = Math.ceil(nperCalc(e183/12, e193, e192));
  const e196 = Math.max(0, e195-e194);
  const e197 = pmtCalc(e183/12, e195, e192);
  const e198 = e197<=0 ? 0 : b30/(e197+b8);

  const e204 = (e188>=1.15 && e198>=1.15) ? (e185<e192?'ALTERNATIVA A':'ALTERNATIVA B')
    : e188>=1.15 ? 'ALTERNATIVA A' : e198>=1.15 ? 'ALTERNATIVA B' : 'NINGUNA';
  const e214 = e204==='ALTERNATIVA A'?e185 : e204==='ALTERNATIVA B'?e192 : Math.min(e185,e192);
  const e215 = e204==='ALTERNATIVA A'?e182 : e204==='ALTERNATIVA B'?e195 : e194;
  const e216 = e204==='ALTERNATIVA A'?e184 : e204==='ALTERNATIVA B'?e197 : pmtCalc(e183/12,e215,e214);
  const e217 = b8+e216;
  const e218 = e217>0 ? b30/e217 : 0;
  const e279 = Math.max(0, b14-e214);
  const e288 = b14>0 ? e279/b14 : 0;

  const costoFinPct = num(S.credito.costoFinanciero), gastosAdmPct = num(S.credito.gastosAdmin);
  const e250 = (b68<=0||b63<=0||b14<=0) ? 0 : b68*(e214/b14);
  const e251 = Math.max(0, b68-e250);
  const ingresosIntAdj = e214*b16*(e215/12);
  const costoFinAdj = e214*costoFinPct*(e215/12);
  const gastosAdmAdj = e214*gastosAdmPct*(e215/12);
  const resultadoNetoAdj = ingresosIntAdj - costoFinAdj - gastosAdmAdj - e250;
  const e253 = e214 ? resultadoNetoAdj/e214 : 0;
  const e254 = num(S.credito.racRequerido||0.05);
  const e233 = b67*1.05;

  const e324 = Math.max(0, Math.min(1, (e218-b33)/((e174-b33)||1)));
  const e322 = e217>0 ? b13/(e217*12) : 0; // (E319=B8+E318=B8+E217 simplificado; E318=E217)
  const e323 = b42>0 ? (e322/b42)-1 : 0;
  const e325 = Math.max(0, Math.min(1, e323));
  const e326 = Math.max(0, Math.min(1, e288));
  const e327 = Math.min(10, e324*5+e325*3+e326*2);
  const e328 = Math.min(100, b67+e327);

  const b135 = (b65>=1.15 && b63<=0.06 && b70>=60 && b67>=80 && b78>=65) ? 'MITIGACIÓN CUMPLIDA' : 'MITIGACIÓN PENDIENTE';
  const b92 = Math.max(0, 1-b63);
  const b347 = Math.round(e214 * Math.max(0,1-b63));
  const b349 = Math.round(pmtCalc(e183/12, e215, b347));
  const b350 = b349+b8;
  const b351 = Math.round((b30/b350)*100)/100;

  // Punto 1-5 del dictamen (idénticos en las 4 ramas de decisión)
  const p1 = `1. El cliente presenta un SCORING CREDITICIO qué indica que tan bueno es el cliente con ${fmtNum(b61,0)} puntos y se clasifica como ${scoring.categoriaRiesgo}.`;
  const p2 = `2. La PD Probabilidad de Incumplimiento en base al scoring del Cliente es de ${fmtPct(b63)}.`;
  const p3tier = b69>=0.15?' favorable frente al mínimo exigido por la institución de '
    : b69>=0.10?' adecuada frente al mínimo exigido por la institución de '
    : b69>=0?'reducida frente al mínimo exigido por la institución de '
    : null;
  const p3 = `3. La RENTABILIDAD AJUSTADA AL RIESGO generada es de ${fmtPct(b69)}. `
    + (p3tier ? `${p3tier}${fmtPct(b14?num(S.credito.racRequerido||0.05):0.05)}.` : 'La operación presenta una rentabilidad ajustada al riesgo negativa.');
  const p4 = `4. El DSCR base (¿Puede pagar hoy la cuota?) es de ${fmtNum(b35,2)} veces y el DSCR bajo ESTRÉS (¿Puede pagar si empeora?) es de ${fmtNum(b65,2)} veces. `
    + (b65>=1?'La capacidad bajo estrés presenta un margen de seguridad adecuado.':'La capacidad bajo estrés presenta un margen de seguridad limitado y requiere ajuste de la estructura.');
  const p5 = `5. El SCORE CONSOLIDADO INTEGRAL (Scoring - PD - DSCR estrés - Resiliencia - RAC), sobre una escala de a 0 a 100 alcanza ${fmtNum(b78,0)} puntos sobre 100 y se clasifica como ${b79}.`;

  // Punto 6 (Conclusión de riesgo) — varía según la decisión
  const p6cierre = b91==='APROBABLE' ? 'Los principales indicadores de riesgo, capacidad de pago y comportamiento se encuentran dentro de los parámetros establecidos. La operación es compatible con el nivel de riesgo y la capacidad financiera del cliente.'
    : b91==='APROBABLE CON MITIGANTES' ? 'La operación es viable, pero requiere el cumplimiento de los mitigantes establecidos.'
    : b91==='REVISAR / AJUSTAR CRÉDITO' ? 'El Score Integral de riesgo no alcanza el nivel requerido para una aprobación directa. El DSCR bajo estrés se encuentra en el umbral mínimo y el RAC Score presenta una posición débil. Se requiere ajustar monto, plazo y/o cuota antes de una nueva aprobación.'
    : 'Los indicadores de riesgo presentan condiciones que no permiten recomendar una nueva exposición. No se recomienda aprobar la operación bajo las condiciones actuales.';
  const p6 = `6. CONCLUSIÓN DE RIESGO: El cliente solicita un crédito de Bs ${fmtNum(b14,0)}.\n`
    + `El monto máximo técnicamente sostenible, de acuerdo con el análisis de capacidad de pago y los escenarios de estrés, se estima en Bs ${fmtNum(b58,0)}.\n`
    + `Al incorporar el nivel de PD, el monto técnico ajustado por riesgo se estima en Bs ${fmtNum(b93,0)}. ${p6cierre}`;

  // Punto 7 (Monto Recomendado) + 8 (Medida Mitigación) + 9 (Condición/Control Posterior)
  const p7 = `7. MONTO RECOMENDADO: Bs ${fmtNum(b94,0)}.`
    + (b94===0 ? 'No se recomienda otorgar una nueva exposición mientras no se ajuste y reevalúe la estructura de la operación.'
              : 'El monto indicado corresponde al nivel recomendado de exposición de acuerdo con la evaluación integral de riesgo y capacidad.')
    + `\n8. MEDIDA DE MITIGACIÓN: ${medidaMitigacion}\n9. CONDICIÓN: ${condicion}\n9. CONTROL POSTERIOR: ${controlPosterior}`;

  // Punto 10 (Resolución) — las 4 (o 5) ramas de decisión exactas del Excel
  const p10 = `10. RESOLUCIÓN: `
    + (b91==='APROBABLE' ? `APROBAR la operación. Monto recomendado: Bs ${fmtNum(b94,0)}.`
      : b91==='APROBABLE CON MITIGANTES' ? `APROBAR CON MITIGANTES la operación. Monto recomendado: Bs ${fmtNum(b94,0)}.`
      : b91==='REVISAR / AJUSTAR CRÉDITO' ? `REVISAR Y AJUSTAR la operación antes de una nueva aprobación. Monto técnico por capacidad: Bs ${fmtNum(b58,0)}. Monto técnico ajustado por riesgo: Bs ${fmtNum(b93,0)}. Estos valores constituyen referencias técnicas para la reestructuración y no representan un monto aprobado.`
      : `NO APROBAR la operación bajo las condiciones actuales. No existe monto recomendado para desembolso.`);

  // Rama "Plan de Ajustes / Diagnóstico con Alternativas" — SOLO se usa cuando la
  // decisión es "REVISAR / AJUSTAR CRÉDITO" (así lo hace la fórmula real del Excel;
  // para las otras 3 decisiones el dictamen NO incluye las Opciones A/B).
  const planAjustes = `6. PLAN DE AJUSTES - ¿QUÉ ACCIONES SE DEBEN EJECUTAR PARA REDUCIR EL RIESGO Y CÓMO?: `
    + (b135==='MITIGACIÓN CUMPLIDA' ? 'No se requieren acciones adicionales. La operación ha cumplido las medidas de mitigación establecidas.'
      : 'Ajustar monto, plazo y/o cuota conforme a las alternativas técnicas calculadas, y reevaluar antes de una nueva aprobación.');

  const parteAjuste = b135==='MITIGACIÓN CUMPLIDA'
    ? 'Los indicadores de riesgo cumplen los objetivos establecidos. La operación puede pasar a una nueva evaluación integral.'
    : `La operación presenta brechas de riesgo que requirieron ajustes a la operación buscando reducir la exposición crediticia y mejorar la capacidad de pago bajo condiciones de estrés. Los resultados son los siguientes:; `
      + `Monto Original Bs: ${fmtNum(b14,2)} → Ajustado bajo estrés Bs ${fmtNum(b56,0)} → Reducción Bs ${fmtNum(e279,0)}; `
      + `PE Original Bs. ${fmtNum(b68,2)} → Ajustada Bs ${fmtNum(e250,0)} → Reducción Bs ${fmtNum(e251,0)}; `
      + `DSCR Original ${fmtNum(e173,2)} → Ajustada Bs ${fmtNum(e218,2)} → Objetivo Bs ${fmtNum(e218,2)}; `
      + `RAC Original ${fmtPct(b69)} → Ajustada Bs ${fmtPct(e253)} → Mínimo Bs ${fmtPct(e254)}; `
      + `RESILENCIA Original ${fmtNum(b67,1)} → Ajustada Bs ${fmtNum(e328,1)} → Objetivo Bs ${fmtNum(e233,1)};`;

  const diagnosticoConOpciones = `7. DIAGNÓSTICO INTEGRAL DE RIESGO: ${parteAjuste}\n`
    + `Luego de los ajustes se tienen dos alternativas:\n`
    + `OPCIÓN A: Monto Bs ${fmtNum(e214,0)} | Plazo: ${fmtNum(e215,0)} meses | Cuota: Bs ${fmtNum(e216,0)} | DSCR estrés: ${fmtNum(b30/e217,2)}.\n`
    + `OPCIÓN B: Monto Bs ${fmtNum(e192,0)} | Plazo: ${fmtNum(e195,0)} meses | Cuota: Bs ${fmtNum(e197,0)} | DSCR estrés: ${fmtNum(e198,2)}\n`
    + `SELECCIÓN: Se adopta la OPCIÓN A por reducir la exposición y mantener el plazo original. La OPCIÓN B mantiene la mayor exposición y requiere ampliar el plazo ${fmtNum(e196,0)} meses, con el consiguiente incremento de los intereses por pagar por parte del cliente.\n`
    + `8. ¿POR QUÉ SE AJUSTÓ?: El monto solicitado supera el nivel considerado adecuado para la operación. La capacidad de pago permite técnicamente hasta (Bs ${fmtNum(e214,0)}), pero al considerar el nivel de riesgo PD obtenida por scoring del cliente de ${fmtPct(b63)} y aplicando un Factor de ajuste (1-PD) = ${fmtPct(b92)}. El Monto resultante después del ajuste por riesgo alcanza a: Bs ${fmtNum(b93,0)}.\n`
    + `9. RECOMENDACIÓN: Se recomienda considerar un Monto de hasta Bs. ${fmtNum(b94,0)}, a ${fmtNum(e215,0)} meses, con una tasa de interés de ${fmtPct(b16)} bajo la OPCIÓN A - REDUCIR MONTO Y MANTENER PLAZO. DSCR estrés final: ${fmtNum(b351,2)}.`;

  // Ensamblado final: si la decisión es REVISAR/AJUSTAR usa el plan de ajustes +
  // diagnóstico con alternativas (D146); en cualquier otro caso usa la conclusión
  // + monto recomendado + mitigación/condición/control + resolución (D147).
  const dictamenCompleto = `DICTAMEN: ${b91}.\n${p1}\n${p2}\n${p3}\n${p4}\n${p5}\n`
    + (b91==='REVISAR / AJUSTAR CRÉDITO'
        ? `${planAjustes}\n${diagnosticoConOpciones}`
        : `${p6}\n${p7}\n${p10}`);

  const diagnosticoTexto = b91==='APROBABLE' ? 'Los principales indicadores de riesgo, capacidad de pago y comportamiento se encuentran dentro de los parámetros establecidos. La operación es compatible con el nivel de riesgo y la capacidad financiera del cliente.'
    : b91==='APROBABLE CON MITIGANTES' ? 'La operación presenta un nivel de riesgo aceptable, pero requiere mitigantes específicos. Se recomienda mantener las condiciones establecidas y realizar seguimiento de los factores de riesgo identificados.'
    : b91==='REVISAR / AJUSTAR CRÉDITO' ? 'El Score Integral de riesgo no alcanza el nivel requerido para una aprobación directa. El DSCR bajo estrés se encuentra en el umbral mínimo y el RAC Score presenta una posición débil. Se requiere ajustar monto, plazo y/o cuota antes de una nueva aprobación.'
    : 'Los indicadores de riesgo presentan condiciones que no permiten recomendar una nueva exposición. No se recomienda aprobar la operación bajo las condiciones actuales.';

  // Nota de fidelidad: las filas 106/107/110 del Excel comparan un valor en Bs.
  // contra B18/B21/B22 — pero esas celdas en realidad apuntan a los parámetros
  // de estrés (Caída Ventas/Aumento Gastos Fam./Shock Cambiario), no a un monto.
  // Es un error de referencia real del archivo original; se preserva tal cual.
  // CORRECCIÓN: en el Excel original estas 3 comparaciones apuntaban por error a
  // los parámetros de estrés (Caída Ventas/Aumento Gastos Fam./Shock Cambiario) en
  // vez del Monto o la Cuota. Se corrige aquí para que el semáforo de cada fila
  // compare contra lo que su propia interpretación describe:
  //  - Activos/Garantía recuperable → deben cubrir el MONTO solicitado.
  //  - Liquidez inmediata y Patrimonio → deben cubrir múltiplos de la CUOTA.

  const b103=b35, b104=b36, b105=b31, b106=b48, b107=b38, b108=b40, b109=b41,

  const estado103 = b103>=1.5?'FAVORABLE':b103>=1.2?'ACEPTABLE':b103>=1?'DÉBIL':'CRÍTICO';

  const estado105 = b105>=0.3?'ALTA':b105>=0.2?'MEDIA':b105>=0.1?'BAJA':'MUY BAJA';

    : b105>=0.1?'El margen de deterioro (CAIDA EN VENTAS) es reducido y requiere seguimiento.'
    : 'El negocio tiene muy poco margen (CAIDA EN VENTAS) antes de alcanzar una situación crítica.';

  const estado106 = b106>=bB18?'ALTO':b106>=bB18*0.75?'MEDIO':b106>=bB18*0.5?'BAJO':'MUY BAJO';
  const interp106 = b106>=bB18?'El respaldo recuperable cubre el monto solicitado.'
    : b106>=bB18*0.75?'Existe un respaldo importante, aunque no cubre completamente el monto solicitado.'

    : 'El respaldo recuperable es insuficiente frente al monto solicitado.';

  const estado107 = b107>=bB22*3?'ALTA':b107>=bB22*2?'MEDIA':b107>=bB22?'BAJA':'CRÍTICA';

    : b107>=bB22?'Cuenta aproximadamente con una cuota de respaldo.'
    : 'La liquidez disponible es insuficiente para cubrir una cuota.';

  const estado108 = b108>=6?'ALTO':b108>=3?'MEDIO':b108>=1?'BAJO':'CRÍTICO';

  const estado109 = b109>=6?'ALTA':b109>=3?'MEDIA':b109>=1?'BAJA':'CRÍTICA';
  const interp109 = b109>=6?'El negocio cuenta con un respaldo importante para enfrentar una interrupción temporal.'

    : 'No existe garantía recuperable considerada en el modelo.';

  const estado112 = b112<=0.2?'BAJA':b112<=0.4?'MEDIA':b112<=0.6?'ALTA':'MUY ALTA';
  const interp112 = b112<=0.2?'La pérdida potencial después de recuperación es baja.'
    : b112<=0.4?'La pérdida potencial después de recuperación es moderada.'
    : b112<=0.6?'La pérdida potencial después de recuperación es elevada.'
    : 'La pérdida potencial después de recuperación es muy elevada.';

  const estado113 = b113>=80?'MUY BUENA':b113>=65?'BUENA':b113>=50?'MEDIA':b113>=40?'BAJA':'CRÍTICA';

  const filas = [
    {n:1, pregunta:'¿Puede pagar hoy la cuota? — COBERTURA DE CUOTA (Saldo/Cuota)= DSCR base', resultado:b103, fmt:'x', estado:estado103, interpretacion:interp103},
    {n:2, pregunta:'¿Puede pagar si empeora? — DSCR estrés', resultado:b104, fmt:'x', estado:estado104, interpretacion:interp104},
    {n:3, pregunta:'¿Cuánto deterioro soporta? — Punto de quiebre - Caída en Ventas', resultado:b105, fmt:'pct', estado:estado105, interpretacion:interp105},
    {n:4, pregunta:'¿Qué respaldo tiene? — Activos recuperables', resultado:b106, fmt:'bs', estado:estado106, interpretacion:interp106},
    {n:5, pregunta:'Liquidez inmediata', resultado:b107, fmt:'bs', estado:estado107, interpretacion:interp107},
    {n:6, pregunta:'Colchón de deuda — ¿Cuántos meses puede pagar deuda?', resultado:b108, fmt:'num', estado:estado108, interpretacion:interp108},
    {n:7, pregunta:'Meses de supervivencia - ¿Cuánto puede sobrevivir?', resultado:b109, fmt:'num', estado:estado109, interpretacion:interp109},
